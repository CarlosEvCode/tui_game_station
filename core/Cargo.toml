[package]
name = "game_core"
version = "1.9.0"
edition = "2021"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
toml_edit = "0.25"
thiserror = "2.0"
anyhow = "1.0"
walkdir = "2.5"
crc32fast = "1.4"
md5 = "0.7"
sha1 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
dirs = "6.0"
reqwest = { version = "0.12", features = ["json"] }
urlencoding = "2.1"
tokio = { version = "1.0", features = ["full"] }
regex = "1"
