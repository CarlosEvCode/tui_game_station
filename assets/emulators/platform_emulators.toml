# Catalog: which emulators are compatible with each platform.
# Source of truth for seeding the `runners` table (see core/src/catalog.rs and
# Database::seed_defaults). Kept as DATA so new emulators ship without touching
# Rust code. The download_url/download_filename mirror the emulator's GitHub
# release asset (direct file, not the HTML page). command_template defaults to
# `"{executable_path}" "{rom}"` and is only overridden here when the emulator
# needs special launch flags.

