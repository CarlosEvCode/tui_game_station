# Emulator launch options for Azahar (Nintendo 3DS).
# Each [[options]] entry is rendered generically in the "Emulator Options" popup
# and expanded into CLI flags when the chosen value differs from `default`.
# `kind` is extensible: "toggle" (flag present/absent) and "choice" (pick one
# value, inserted where `{value}` appears in `flag_template`).

note = "Azahar Plus command line options"
process_name = "azahar"

[[options]]
key = "fullscreen"
name = "Fullscreen"
kind = "toggle"
default = "0"
flag_template = "-f"

[[options]]
key = "renderer"
name = "Renderer"
kind = "choice"
default = "opengl"
flag_template = "--renderer {value}"
choices = ["software", "opengl", "vulkan"]
[options.config_target]
# Azahar (standard) and Azahar Plus are separate builds that write to different,
# FIXED config directories. The launcher picks which qt-config.ini to patch at
# save time: the only existing one, or the most recently modified one if both
# exist. Nothing is written when neither exists (non-blocking).
file_candidates = ["~/.config/azahar-emu/qt-config.ini", "~/.config/azaharplus-emu/qt-config.ini"]
format = "qt_ini"
# TODO: real section/key once the actual qt-config.ini is shared.
section = "TODO"
key = "TODO"

[[options]]
key = "accurate_bus"
name = "Accurate Bus Timing"
kind = "toggle"
default = "0"
flag_template = "--accurate-bus"
