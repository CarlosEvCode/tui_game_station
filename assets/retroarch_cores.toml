# Curated initial catalog of RetroArch cores per platform.
# Linux x86_64 cores URL convention:
# https://buildbot.libretro.com/nightly/linux/x86_64/latest/{so_filename}.zip

[platform.snes]
[[platform.snes.cores]]
key = "snes9x"
name = "Snes9x"
so_file = "snes9x_libretro.so"
download_url = "https://buildbot.libretro.com/nightly/linux/x86_64/latest/snes9x_libretro.so.zip"

[[platform.snes.cores]]
key = "bsnes"
name = "bsnes"
so_file = "bsnes_libretro.so"
download_url = "https://buildbot.libretro.com/nightly/linux/x86_64/latest/bsnes_libretro.so.zip"

