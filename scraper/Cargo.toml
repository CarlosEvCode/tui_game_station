[package]
name = "scraper"
version = "1.9.0"  # x-release-please-version
edition = "2021"

[dependencies]
game_core = { path = "../core" }
tokio = { version = "1.43", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
urlencoding = "2.1"
anyhow = "1.0"
tracing = "0.1"
regex = "1.11"
dirs = "6.0"
