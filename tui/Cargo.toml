[package]
name = "tui"
version = "1.9.0"  # x-release-please-version
edition = "2021"

[dependencies]
game_core = { path = "../core" }
runner = { path = "../runner" }
scraper = { path = "../scraper" }
ratatui = "0.29"
figlet-rs = "1.0"
crossterm = "0.28"
ratatui-image = "3.0"
image = "0.25"
tokio = { version = "1.43", features = ["full"] }
dirs = "6.0"
anyhow = "1.0"
rfd = "0.15"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-util = "0.3"
self-replace = "1.5"
flate2 = "1.0"
tar = "0.4"
gilrs = "0.11"
